name: KI-DJ APK

# Builds an installable debug APK of the KI-DJ fork on GitHub's free runners.
on:
  workflow_dispatch:
  push:
    branches: ["ki-dj", "main"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: KI-DJ unit tests
        run: ./gradlew --console=plain :app:testFossDebugUnitTest --tests "com.metrolist.music.kidj.*"
      - name: Debug signing key
        # A fixed key (repo secret KIDJ_DEBUG_KEYSTORE, base64) lets new APKs update the installed app.
        env:
          KEYSTORE_B64: ${{ secrets.KIDJ_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KI-DJ Debug"
          fi
      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleFossDebug -x lint
        env:
          METROLIST_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: ki-dj-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Publish APK as direct download
        # Fixed link: https://github.com/<owner>/<repo>/releases/download/ki-dj-latest/KI-DJ.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find app/build/outputs/apk -name '*.apk'
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" KI-DJ.apk
          gh release view ki-dj-latest >/dev/null 2>&1 || gh release create ki-dj-latest --target "$GITHUB_SHA" \
            --title "KI-DJ (neuester Build)" --notes "Auf dem Handy KI-DJ.apk antippen und installieren."
          gh release upload ki-dj-latest KI-DJ.apk --clobber
